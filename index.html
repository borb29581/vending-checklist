<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>서초점 자판기 재고 체크리스트</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
        }

        .info {
            margin-bottom: 24px;
        }

        .info input {
            padding: 8px;
            font-size: 16px;
        }

        .category {
            margin-top: 30px;
        }

        .category h2 {
            border-bottom: 2px solid #333;
            padding-bottom: 8px;
        }
        

        .items {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }

        .item {
            min-height: 110px;
            border: 2px solid #333;
            border-radius: 8px;
            background: white;
            padding: 10px;
            cursor: pointer;

            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;

            text-align: center;
            font-size: 15px;

            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
        }

        .item:hover {
            background: #f0f0f0;
        }

        .name {
            font-weight: bold;
        }

        .amount {
            font-size: 14px;
        }

        .status {
            font-size: 28px;
            font-weight: bold;
            min-height: 34px;
        }

        .reset-button {
            margin-top: 30px;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            cursor: pointer;
        }
        .notice {
            margin-bottom: 20px;
            padding: 12px 15px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        .notice p {
            margin: 3px 0;
}
/* ===== 모바일 화면 최적화 ===== */

@media (max-width: 600px) {

    body {
        padding: 8px;
    }

    .container {
        padding: 10px;
        border-radius: 8px;
    }

    h1 {
        font-size: 21px;
        margin-bottom: 12px;
    }

    .notice {
        font-size: 11px;
        padding: 9px 10px;
        margin-bottom: 12px;
    }

    .info {
        font-size: 12px;
        margin-bottom: 18px;
    }

    .info input {
        padding: 6px;
        font-size: 12px;
        width: 130px;
    }

    .category {
        margin-top: 20px;
    }

    .category h2 {
        font-size: 15px;
        margin-bottom: 8px;
        padding-bottom: 5px;
    }

    .items {
        grid-template-columns: repeat(4, 1fr);
        gap: 5px;
    }

    .item {
        min-height: 78px;
        padding: 5px 3px;
        border-width: 1px;
        border-radius: 5px;
    }

    .name {
        font-size: 10px;
        line-height: 1.2;
    }

    .amount {
        font-size: 9px;
    }

    .status {
        font-size: 21px;
        min-height: 23px;
    }

    .reset-button {
        margin-top: 20px;
        padding: 10px;
        font-size: 12px;
    }
}  
/* ===== 하단 버튼 ===== */

.bottom-buttons {
    display: flex;
    gap: 10px;
    margin-top: 30px;
}

.report-button,
.reset-button {
    flex: 1;
    padding: 14px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 0;
}


/* ===== 보고용 화면 ===== */

body.report-mode {
    padding: 5px;
    background: white;
}

body.report-mode .container {
    max-width: 1000px;
    padding: 8px;
    border-radius: 0;
}

body.report-mode h1 {
    font-size: 20px;
    margin-bottom: 6px;
}

body.report-mode .notice {
    padding: 6px 8px;
    margin-bottom: 6px;
    font-size: 9px;
    line-height: 1.3;
}

body.report-mode .info {
    margin-bottom: 8px;
    font-size: 10px;
}

body.report-mode .info p {
    margin: 4px 0;
}

body.report-mode .info input {
    border: none;
    padding: 0;
    font-size: 10px;
    width: 100px;
}

body.report-mode .category {
    margin-top: 10px;
}

body.report-mode .category h2 {
    font-size: 12px;
    margin: 0 0 4px 0;
    padding-bottom: 3px;
    border-bottom-width: 1px;
}

body.report-mode .items {
    grid-template-columns: repeat(8, 1fr);
    gap: 3px;
}

body.report-mode .item {
    min-height: 55px;
    padding: 3px 2px;
    border-width: 1px;
    border-radius: 3px;
}

body.report-mode .name {
    font-size: 8px;
    line-height: 1.1;
}

body.report-mode .amount {
    font-size: 7px;
}

body.report-mode .status {
    font-size: 15px;
    min-height: 16px;
}

body.report-mode .bottom-buttons {
    margin-top: 10px;
}

body.report-mode .reset-button {
    display: none;
}
/* ===== 부족 품목 요약 ===== */

.shortage-summary {
    display: none;
}

body.report-mode .shortage-summary {
    display: block;
    margin-top: 12px;
    padding: 8px;
    border: 1px solid #333;
}

body.report-mode .shortage-summary h2 {
    margin: 0 0 6px 0;
    font-size: 12px;
}

.shortage-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
}

.shortage-item {
    border: 1px solid #aaa;
    padding: 5px;
    font-size: 10px;
    text-align: center;
}

.shortage-item strong {
    font-size: 12px;
}
    </style>
</head>

<body>

<div class="container">

    <h1>서초점 자판기 재고 체크리스트</h1>

    <div class="notice">
    <p>
        자판기 품목별 재고 현황을 파악하여 신속한 보충에 활용하세요!
    </p>

    <p>
        (간식류 보관 위치 - 프린터 좌측 슬라이딩 도어)
    </p>

    <p>
        * 주문 필요한 제품은 마감 보고시 '건의 사항'으로 요청주세요 :)
    </p>
</div>

    <div class="info">
        <p>점검 일자: <strong id="date"></strong></p>

        <label>
            점검 매니저:
            <input id="manager" type="text" placeholder="이름을 입력하세요">
        </label>
    </div>

    <div id="checklist"></div>

<div id="shortage-summary" class="shortage-summary">
    <h2>부족 품목 요약</h2>
    <div id="shortage-list"></div>
</div>

<div class="bottom-buttons">

    <button class="report-button" onclick="toggleReportMode()">
        보고용 화면
    </button>

    <button class="reset-button" onclick="resetChecklist()">
        전체 초기화
    </button>

</div>

</div>


<script>

const categories = [
    {
        name: "에너지 드링크",
        items: [
            ["모구모구", "총 4~5개"],
            ["몬스터 울트라", "총 5개"],
            ["몬스터 울트라", "총 5개"],
            ["몬스터 망고", "총 5개"],
            ["몬스터 망고", "총 5개"],
            ["더킹 파인애플", "총 5개"],
            ["더킹 복숭아", "총 5개"],
            ["더킹 포도", "총 5개"]
        ]
    },

    {
        name: "뚱캔",
        items: [
            ["포카리", "총 5개"],
            ["파워에이드", "총 5개"],
            ["스프라이트", "총 5개"],
            ["밀키스", "총 5개"],
            ["펩시제로", "총 5개"],
            ["코카콜라", "총 5개"],
            ["코크제로", "총 5개"],
            ["웰치스포도", "총 5개"]
        ]
    },

    {
        name: "얇은캔 · 팩음료",
        items: [
            ["비타오백", "총 6개"],
            ["데자와", "총 6개"],
            ["쌕쌕오렌지", "총 6개"],
            ["데미소다 복숭아", "총 6개"],
            ["데미소다 사과", "총 6개"],
            ["피크닉사과", "총 6개"],
            ["초코에몽", "총 6개"],
            ["초코에몽", "총 9개"]
        ]
    },

    {
        name: "간식 1",
        items: [
            ["허니버터 아몬드", "총 6~7개"],
            ["군옥수수 아몬드", "총 6~7개"],
            ["킨더부에노", "총 6개"],
            ["몰티져스", "총 6개"],
            ["몽쉘", "총 7~8개"],
            ["예감", "총 7~8개"],
            ["마이구미", "총 6~7개"],
            ["물티슈", "중간 정도"]
        ]
    },

    {
        name: "간식 2",
        items: [
            ["코피코캔디", "중간 정도"],
            ["트윅스", "중간 정도"],
            ["스니커즈", "중간 정도"],
            ["이클립스", "중간 정도"],
            ["구운감자", "중간 정도"],
            ["포테이토 크리스프", "중간 정도"],
            ["비쵸비", "중간 정도"],
            ["물티슈", "중간 정도"]
        ]
    },

    {
        name: "박스 과자",
        items: [
            ["ABC초코쿠키", "총 4개"],
            ["씨리얼 과자", "총 4개"],
            ["초코송이", "총 4개"],
            ["칸쵸", "총 4개"]
        ]
    }
];


const statusList = ["", "✓", "-1", "-2", "-3"];


function createChecklist() {

    const checklist = document.getElementById("checklist");

    categories.forEach(category => {

        const categoryDiv = document.createElement("div");
        categoryDiv.className = "category";

        const title = document.createElement("h2");
        title.textContent = category.name;

        const itemsDiv = document.createElement("div");
        itemsDiv.className = "items";


        category.items.forEach(item => {

            const button = document.createElement("button");
            button.className = "item";

            button.dataset.status = "0";

            button.innerHTML = `
                <div class="name">${item[0]}</div>
                <div class="amount">${item[1]}</div>
                <div class="status"></div>
            `;


            button.addEventListener("click", () => {

                let currentStatus = Number(button.dataset.status);

                currentStatus++;

                if (currentStatus >= statusList.length) {
                    currentStatus = 0;
                }

                button.dataset.status = currentStatus;

                button.querySelector(".status").textContent =
                    statusList[currentStatus];
            });


            itemsDiv.appendChild(button);
        });


        categoryDiv.appendChild(title);
        categoryDiv.appendChild(itemsDiv);

        checklist.appendChild(categoryDiv);
    });
}


function resetChecklist() {

    const buttons = document.querySelectorAll(".item");

    buttons.forEach(button => {

        button.dataset.status = "0";

        button.querySelector(".status").textContent = "";
    });
}


const today = new Date();

document.getElementById("date").textContent =
    today.getFullYear() + ". " +
    String(today.getMonth() + 1).padStart(2, "0") + ". " +
    String(today.getDate()).padStart(2, "0");
function createShortageSummary() {

    const shortageList = document.getElementById("shortage-list");

    shortageList.innerHTML = "";

    const shortageItems = [];

    document.querySelectorAll(".item").forEach(button => {

        const statusNumber = Number(button.dataset.status);

        // 2 = -1, 3 = -2, 4 = -3
        if (statusNumber >= 2) {

            const name =
                button.querySelector(".name").textContent;

            const status =
                button.querySelector(".status").textContent;

            shortageItems.push({
                name: name,
                status: status
            });
        }
    });


    if (shortageItems.length === 0) {

        shortageList.innerHTML =
            "<p>부족한 품목이 없습니다. ✓</p>";

        return;
    }


    const grid = document.createElement("div");

    grid.className = "shortage-grid";


    shortageItems.forEach(item => {

        const div = document.createElement("div");

        div.className = "shortage-item";

        div.innerHTML = `
            ${item.name}
            <br>
            <strong>${item.status}</strong>
        `;

        grid.appendChild(div);
    });


    shortageList.appendChild(grid);
}

function toggleReportMode() {

    document.body.classList.toggle("report-mode");

    const button = document.querySelector(".report-button");

    if (document.body.classList.contains("report-mode")) {

        createShortageSummary();

        button.textContent = "점검 화면으로 돌아가기";

    } else {

        button.textContent = "보고용 화면";
    }
}


createChecklist();

if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
            .then(() => {
                console.log("Service Worker 등록 완료");
            })
            .catch(error => {
                console.log("Service Worker 등록 실패:", error);
            });
    });
}
</script>

</body>
</html>
